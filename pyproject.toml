[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-log-viewer"
dynamic = ["version"]
description = "Analisis dan replay log telemetri AUV Kraken (IMU, setpoint, PPS, PWM, lintasan)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kraken-viewer = "kraken_viewer.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kraken_viewer.__version__"}

[tool.setuptools.packages.find]
include = ["kraken_viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
